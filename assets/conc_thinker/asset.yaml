# 概念装置 · 思考机（docs/10-契约/mini-codex.md §一 #5；L4 三件之一）。
# 一次模型调用：提示词（纸条）进、计划与 token 出；接口 prompt→plan 预留接真模型。
# 世界状态注册见 game/scripts/levels/l4/l4_flow.gd setup_world()——
# assetId/defaults/端口形状照抄运行时注册，防漂移。
# blockTypes 理由：流程机械——控制流的思考源点（L5 装配投影 block=think），
# 提示词进计划出，故家族一之外加家族二 flow_ 拓扑展示；
# 又加 dialogue_（方块体系 §五 #8：提示词、模型回答、多轮交互）——思考机字面
# 就是"提示词（纸条）进、模型回答（token）出"，进出两侧即多轮对话的两端。
assetId: conc_thinker
kind: parametric
blockTypes: [code_block, flow_, dialogue_]
conceptIds: [c8.1]
footprint: [2, 1]
anchor: bottom-center
ports:
  - id: prompt_in
    kind: ANALOG
    dir: in
  - id: tokens_out
    kind: ANALOG
    dir: out
defaults:
  prompt: ""
scene: game/scenes/levels/l4/components/thinker.tscn
shots:
  - shot: iso
    action: idle
    duration: 3.0
    output: assets/conc_thinker/iso_idle/
  - shot: iso
    action: run
    duration: 5.0
    output: assets/conc_thinker/iso_run/
  - shot: front
    action: idle
    duration: 2.0
    output: assets/conc_thinker/front_idle/
  - shot: close
    action: run
    duration: 4.0
    output: assets/conc_thinker/close_run/
