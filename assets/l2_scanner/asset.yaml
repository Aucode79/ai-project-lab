# 概念装置 · 扫描器（docs/10-契约/mini-codex.md §一 #14；L2 三件之一）。
# 一切读取的工具头载体：扫过柜格，命中内容进入上下文（读留淡痕，按 fade_seconds 淡出）。
# 世界状态注册见 game/scripts/levels/l2/l2_flow.gd setup_world()——
# assetId/defaults/端口形状照抄运行时注册（l2_scanner），防漂移。
# blockTypes 理由：流程机械（工具头）——读动作的载体，扫过柜格输出内容，
# 不承载表格或展示拓扑，归家族一 code_block。
assetId: l2_scanner
kind: parametric
blockTypes: [code_block]
conceptIds: [c10.3, c8.5]
footprint: [1, 1]
anchor: bottom-center
ports:
  - id: scan_out
    kind: ANALOG
    dir: out
defaults:
  target_file: "report.txt"
  scan_range: 3.0
  fade_seconds: 3.0
scene: game/scenes/levels/l2/components/scanner.tscn
shots:
  - shot: iso
    action: idle
    duration: 3.0
    output: assets/l2_scanner/iso_idle/
  - shot: iso
    action: run
    duration: 5.0
    output: assets/l2_scanner/iso_run/
  - shot: front
    action: idle
    duration: 2.0
    output: assets/l2_scanner/front_idle/
  - shot: close
    action: run
    duration: 4.0
    output: assets/l2_scanner/close_run/
