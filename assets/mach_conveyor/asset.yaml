# 机械 · 传送带（AnimatableBody3D 带面 + 摩擦搬运，做法同 bench_world.gd）
assetId: mach_conveyor
kind: parametric
blockTypes: [code_block]
conceptIds: []
footprint: [4, 1]
anchor: bottom-center
ports:
  - id: feed
    kind: BOOL
    dir: in
  - id: discharge
    kind: BOOL
    dir: out
  - id: power
    kind: BOOL
    dir: in
defaults:
  belt_speed: 0.8
  belt_length: 4.0
shots:
  - shot: iso
    action: idle
    duration: 3.0
    output: assets/mach_conveyor/iso_idle/
  - shot: iso
    action: run
    duration: 5.0
    output: assets/mach_conveyor/iso_run/
  - shot: vista
    action: run
    duration: 6.0
    output: assets/mach_conveyor/vista_run/
  - shot: close
    action: run
    duration: 3.0
    output: assets/mach_conveyor/close_run/
