# 概念装置 · 校验门（docs/10-契约/mini-codex.md §一 #10；L5 四件之一）。
# 质检门：通过或拒绝分岔（codex.verify，failId c10.3:1=字段集不等）。
# 世界状态注册见 game/scripts/levels/l5/l5_flow.gd setup_world()——
# assetId/defaults/端口形状照抄运行时注册，防漂移。
# blockTypes 理由：流程机械——流程中的分岔门（编译器投影 block=validate），
# 与 mach_verify_gate 同款 [code_block, flow_]。
# 注：block 是编译器投影参数照抄；required_keys 运行时为数组（["tool","args"]，
# schema 声明的必需字段集），资产库 defaults 只收标量，未记——
# 该字段集即 c10.3 旋钮 schema_fields 的绑定目标（concepts.yaml knobBinding）。
assetId: conc_verify_gate
kind: parametric
blockTypes: [code_block, flow_]
conceptIds: [c10.3]
footprint: [2, 3]
anchor: bottom-center
ports:
  - id: payload
    kind: ANALOG
    dir: in
  - id: ctl
    kind: BOOL
    dir: in
  - id: next
    kind: BOOL
    dir: out
defaults:
  block: "validate"
scene: game/scenes/levels/l5/components/verify_gate.tscn
shots:
  - shot: iso
    action: idle
    duration: 3.0
    output: assets/conc_verify_gate/iso_idle/
  - shot: iso
    action: run
    duration: 5.0
    output: assets/conc_verify_gate/iso_run/
  - shot: front
    action: idle
    duration: 2.0
    output: assets/conc_verify_gate/front_idle/
  - shot: close
    action: fail
    duration: 3.0
    output: assets/conc_verify_gate/close_fail/
  - shot: close
    action: run
    duration: 4.0
    output: assets/conc_verify_gate/close_run/
