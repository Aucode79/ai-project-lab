# 概念装置 · 记忆柜（docs/10-契约/mini-codex.md §一 #6；L3 两件之一）。
# 跨轮保留的显式笔记：三抽屉，读写时开合可见（memory.write / memory.read 步）。
# 世界状态注册见 game/scripts/levels/l3/l3_flow.gd setup_world()——
# assetId/defaults/端口形状照抄运行时注册，防漂移。
# blockTypes 理由：容器——承载三抽屉显式记录表（抽屉即表行）；
# 开合是抽屉的动作词（shots 的 open/close）。
assetId: conc_memory_cabinet
kind: parametric
blockTypes: [code_block, table_]
conceptIds: [c10.2]
footprint: [2, 1]
anchor: bottom-center
ports:
  - id: note_in
    kind: ANALOG
    dir: in
  - id: note_out
    kind: ANALOG
    dir: out
defaults:
  drawer1: ""
  drawer2: ""
  drawer3: ""
scene: game/scenes/levels/l3/components/memory_cabinet.tscn
shots:
  - shot: iso
    action: idle
    duration: 3.0
    output: assets/conc_memory_cabinet/iso_idle/
  - shot: iso
    action: run
    duration: 5.0
    output: assets/conc_memory_cabinet/iso_run/
  - shot: front
    action: idle
    duration: 2.0
    output: assets/conc_memory_cabinet/front_idle/
  - shot: front
    action: open
    duration: 2.0
    output: assets/conc_memory_cabinet/front_open/
  - shot: front
    action: close
    duration: 2.0
    output: assets/conc_memory_cabinet/front_close/
  - shot: close
    action: run
    duration: 4.0
    output: assets/conc_memory_cabinet/close_run/
