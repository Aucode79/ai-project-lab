# 概念装置 · 回廊（docs/10-契约/mini-codex.md §一 #12；L5 四件之一）。
# 想→做→看的带环回廊：步数（rounds）与循环上限（loop_limit），
# loop 回边 + done 显式出口（guard）。
# 世界状态注册见 game/scripts/levels/l5/l5_flow.gd setup_world()——
# assetId/defaults/端口形状照抄运行时注册，防漂移。
# blockTypes 理由：流程机械——循环机械本体（编译器投影 block=guard），
# 回边与显式出口即控制流拓扑，故家族一之外加 flow_。
# 注：block 是编译器投影参数照抄；loop/done 命中控制词汇表，映射控制端口。
assetId: conc_loop_gallery
kind: parametric
blockTypes: [code_block, flow_]
conceptIds: [c10.3]
footprint: [3, 2]
anchor: bottom-center
ports:
  - id: payload
    kind: ANALOG
    dir: in
  - id: ctl
    kind: BOOL
    dir: in
  - id: loop
    kind: BOOL
    dir: out
  - id: done
    kind: BOOL
    dir: out
defaults:
  block: "guard"
  loop_limit: 3
  rounds: 0
scene: game/scenes/levels/l5/components/loop_gallery.tscn
shots:
  - shot: iso
    action: idle
    duration: 3.0
    output: assets/conc_loop_gallery/iso_idle/
  - shot: iso
    action: run
    duration: 5.0
    output: assets/conc_loop_gallery/iso_run/
  - shot: front
    action: idle
    duration: 2.0
    output: assets/conc_loop_gallery/front_idle/
  - shot: close
    action: run
    duration: 4.0
    output: assets/conc_loop_gallery/close_run/
